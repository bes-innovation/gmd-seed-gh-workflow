# Reference only -- files starting with "_" are ignored by
# gmd-seed-bootstrap-project-wfl.yml. Copy this to <repo-name>.yaml to
# provision a real project. See README.md in this folder for the full schema.

repoName: bootstrap-app
description: "Bootstrap Salesforce project"
visibility: public

environments:
  - name: integration
    requiredReviewers: false
  - name: uat
    requiredReviewers: false
  - name: prod
    requiredReviewers: true

branchProtection:
  - branch: develop
    requiredStatusChecks: []
    requiredApprovingReviewCount: 1
  # Wildcard pattern -- matches any release/x.y.z cut later (they don't
  # exist yet at provisioning time). Applied via a GitHub Ruleset instead
  # of classic branch protection, since that API only works on one
  # already-existing branch.
  - branch: release/**
    requiredStatusChecks: []
    requiredApprovingReviewCount: 1
  - branch: main
    requiredStatusChecks: []
    requiredApprovingReviewCount: 1
