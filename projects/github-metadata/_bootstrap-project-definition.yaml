# Reference only -- files starting with "_" are ignored by
# gmd-seed-bootstrap-project-wfl.yml. Copy this to <repo-name>.yaml to
# provision a real project. See README.md in this folder for the full schema.

repoName: bootstrap-app
description: "Bootstrap Salesforce project"
visibility: public

environments:
  - name: integration
    requiredReviewers: false
  - name: uat
    requiredReviewers: false
  - name: prod
    requiredReviewers: true

branchProtection:
  - branch: develop
    requiredStatusChecks: []
    requiredApprovingReviewCount: 1
  # Wildcard pattern -- matches any release/x.y.z cut later (they don't
  # exist yet at provisioning time). Applied via a GitHub Ruleset instead
  # of classic branch protection, since that API only works on one
  # already-existing branch.
  - branch: release/**
    requiredStatusChecks: []
    requiredApprovingReviewCount: 1
  - branch: main
    requiredStatusChecks: []
    requiredApprovingReviewCount: 1

# Reference only -- not yet read/applied by gmd-seed-bootstrap-project-wfl.yml.
# Documents the intended branch-naming ruleset for multi-squad repos so it can
# be provisioned (manually via `gh api repos/<owner>/<repo>/rulesets`, or by
# extending the bootstrap workflow later) without re-deriving the pattern.
# See README.md "Branch naming ruleset (not yet automated)" for the full
# GitHub Ruleset API payload this maps to.
branchNamingRules:
  - appliesTo: "feature/**"
    pattern: '^feature/dev-[a-z0-9-]+/[a-z0-9-]+$'
    example: "feature/dev-cloudgaia/fix-login-redirect"
    description: "feature/dev-<team>/<task-description>, one squad per <team> segment"
