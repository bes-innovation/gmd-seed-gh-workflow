# Reference only -- files starting with "_" are ignored by
# gmd-seed-bootstrap-project-wfl.yml. Copy this to <repo-name>.yaml to
# provision a real project. See README.md in this folder for the full schema.

repoName: sf-app
description: "Sf App"
visibility: public

environments:
  - name: integration
    requiredReviewers: false
  - name: uat
    requiredReviewers: false
  - name: prod
    requiredReviewers: true

branchProtection:
  - branch: develop
    requiredStatusChecks: []
    requiredApprovingReviewCount: 0
  - branch: staging
    requiredStatusChecks: []
    requiredApprovingReviewCount: 0    
  - branch: main
    requiredStatusChecks: []
    requiredApprovingReviewCount: 0
