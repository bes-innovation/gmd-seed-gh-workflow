name: gmd-seed-wfl-sf-deploy

# Caller must use `secrets: inherit` and define a GitHub Environment matching
# `inputs.environment` in its own repo settings, with:
#   - SFDX_USERNAME, SFDX_CLIENT_ID, SFDX_INSTANCE_URL as Environment secrets
#   - SFDX_JWT_KEY as a Repository secret (or Environment secret if the
#     Connected App differs per org)
#   - a TEAMS_WEBHOOK_URL secret (Teams "Workflows" incoming webhook)
#   - "Required reviewers" protection rule enabled on environments that need
#     a human gate (GDM: PROD) -- THIS is the approval gate. It pauses the
#     whole job (before any step runs) until approved. There is no separate
#     approval step in this file; it's a platform feature tied to the
#     `environment:` key on the job below.

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub Environment to deploy against (e.g. qa, uat, prod)"
        required: true
        type: string
      target-org:
        description: "Alias for the target org (used for logging/display only)"
        required: false
        type: string
        default: "target-org"
      source-dir:
        description: "Path to the source-format directory to deploy"
        required: false
        type: string
        default: "force-app"
      test-level:
        description: "Apex test level to run during deploy"
        required: false
        type: string
        default: "RunLocalTests"
      tests:
        description: "Space-separated Apex test class names -- only used when test-level is RunSpecifiedTests"
        required: false
        type: string
        default: ""
      use-quick-deploy:
        description: "Validate first, then quick-deploy the validated result instead of re-running tests (GDM recommendation for PROD)"
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      # secrets can't be referenced directly in `if:` conditions, so check
      # presence here (env: does allow secrets) and gate on this step's output.
      - name: Check Teams webhook configured
        id: teams_check
        env:
          WEBHOOK: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: echo "configured=$([ -n "$WEBHOOK" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Push events (merges) carry a PR reference via the "list pull requests
      # associated with a commit" API; direct pushes have none, which is fine
      # -- the fact is just omitted from the card.
      - name: Look up associated pull request
        id: pr
        if: steps.teams_check.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_JSON=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0] // empty')
          if [ -n "$PR_JSON" ]; then
            echo "reference=#$(echo "$PR_JSON" | jq -r '.number') · $(echo "$PR_JSON" | jq -r '.title')" >> "$GITHUB_OUTPUT"
            echo "url=$(echo "$PR_JSON" | jq -r '.html_url')" >> "$GITHUB_OUTPUT"
          else
            echo "reference=" >> "$GITHUB_OUTPUT"
            echo "url=" >> "$GITHUB_OUTPUT"
          fi

      # Salesforce's own startDate isn't known yet at this point (the deploy
      # hasn't been submitted) -- wall-clock time is the best we have here.
      - name: Record job start time
        id: job_started
        if: steps.teams_check.outputs.configured == 'true'
        run: echo "now=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"

      # Runs only once the environment's required reviewers have approved.
      # Skipped entirely if TEAMS_WEBHOOK_URL isn't configured on this environment.
      - name: Notify Teams - deployment starting
        if: steps.teams_check.outputs.configured == 'true'
        uses: bes-innovation/gmd-seed-gh-workflow/actions/teams-notify@v1
        with:
          webhook-url: ${{ secrets.TEAMS_WEBHOOK_URL }}
          status: started
          title: "Deployment started: ${{ inputs.environment }}"
          environment: ${{ inputs.environment }}
          branch: ${{ github.ref_name }}
          pull-request: ${{ steps.pr.outputs.reference }}
          pull-request-url: ${{ steps.pr.outputs.url }}
          started-at: ${{ steps.job_started.outputs.now }}

      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        uses: bes-innovation/gmd-seed-gh-workflow/actions/sf-cli-setup@v1

      - name: Authenticate to Salesforce
        uses: bes-innovation/gmd-seed-gh-workflow/actions/sf-auth-jwt@v1
        with:
          username: ${{ secrets.SFDX_USERNAME }}
          client-id: ${{ secrets.SFDX_CLIENT_ID }}
          instance-url: ${{ secrets.SFDX_INSTANCE_URL }}
          jwt-key: ${{ secrets.SFDX_JWT_KEY }}
          alias: ${{ inputs.target-org }}

      - name: Validate deployment
        id: validate
        if: inputs.use-quick-deploy
        uses: bes-innovation/gmd-seed-gh-workflow/actions/sf-deploy-metadata@v1
        with:
          target-org: ${{ inputs.target-org }}
          source-dir: ${{ inputs.source-dir }}
          test-level: ${{ inputs.test-level }}
          tests: ${{ inputs.tests }}
          check-only: "true"
          wait: "60"

      - name: Quick-deploy validated result
        id: quick_deploy
        if: inputs.use-quick-deploy && steps.validate.outcome == 'success'
        uses: bes-innovation/gmd-seed-gh-workflow/actions/sf-quick-deploy@v1
        with:
          target-org: ${{ inputs.target-org }}
          job-id: ${{ steps.validate.outputs.job-id }}
          wait: "60"

      - name: Deploy metadata
        id: deploy
        if: ${{ !inputs.use-quick-deploy }}
        uses: bes-innovation/gmd-seed-gh-workflow/actions/sf-deploy-metadata@v1
        with:
          target-org: ${{ inputs.target-org }}
          source-dir: ${{ inputs.source-dir }}
          test-level: ${{ inputs.test-level }}
          tests: ${{ inputs.tests }}
          check-only: "false"

      - name: Notify Teams - deployment succeeded
        if: success() && steps.teams_check.outputs.configured == 'true'
        uses: bes-innovation/gmd-seed-gh-workflow/actions/teams-notify@v1
        with:
          webhook-url: ${{ secrets.TEAMS_WEBHOOK_URL }}
          status: success
          title: "Deployment succeeded: ${{ inputs.environment }}"
          environment: ${{ inputs.environment }}
          branch: ${{ github.ref_name }}
          pull-request: ${{ steps.pr.outputs.reference }}
          pull-request-url: ${{ steps.pr.outputs.url }}
          started-at: ${{ steps.deploy.outputs.started-at || steps.quick_deploy.outputs.started-at || steps.validate.outputs.started-at }}
          completed-at: ${{ steps.deploy.outputs.completed-at || steps.quick_deploy.outputs.completed-at || steps.validate.outputs.completed-at }}
          components-summary: ${{ steps.deploy.outputs.components-summary || steps.quick_deploy.outputs.components-summary || steps.validate.outputs.components-summary }}
          tests-summary: ${{ steps.deploy.outputs.tests-summary || steps.quick_deploy.outputs.tests-summary || steps.validate.outputs.tests-summary }}
          salesforce-url: ${{ steps.deploy.outputs.deploy-url || steps.quick_deploy.outputs.deploy-url || steps.validate.outputs.deploy-url }}

      - name: Notify Teams - deployment failed
        if: failure() && steps.teams_check.outputs.configured == 'true'
        uses: bes-innovation/gmd-seed-gh-workflow/actions/teams-notify@v1
        with:
          webhook-url: ${{ secrets.TEAMS_WEBHOOK_URL }}
          status: failure
          title: "Deployment failed: ${{ inputs.environment }}"
          environment: ${{ inputs.environment }}
          branch: ${{ github.ref_name }}
          pull-request: ${{ steps.pr.outputs.reference }}
          pull-request-url: ${{ steps.pr.outputs.url }}
          started-at: ${{ steps.deploy.outputs.started-at || steps.quick_deploy.outputs.started-at || steps.validate.outputs.started-at }}
          completed-at: ${{ steps.deploy.outputs.completed-at || steps.quick_deploy.outputs.completed-at || steps.validate.outputs.completed-at }}
          components-summary: ${{ steps.deploy.outputs.components-summary || steps.quick_deploy.outputs.components-summary || steps.validate.outputs.components-summary }}
          tests-summary: ${{ steps.deploy.outputs.tests-summary || steps.quick_deploy.outputs.tests-summary || steps.validate.outputs.tests-summary }}
          salesforce-url: ${{ steps.deploy.outputs.deploy-url || steps.quick_deploy.outputs.deploy-url || steps.validate.outputs.deploy-url }}
          error-message: ${{ steps.deploy.outputs.error-message || steps.quick_deploy.outputs.error-message || steps.validate.outputs.error-message }}
