name: "sf-deploy-metadata"
description: "Deploy or validate the force-app source against a target org (full deployment of the immutable artifact)"

inputs:
  target-org:
    description: "Alias or username of the org to deploy into"
    required: true
  source-dir:
    description: "Path to the source-format directory to deploy"
    required: false
    default: "force-app"
  test-level:
    description: "Apex test level (NoTestRun, RunSpecifiedTests, RunLocalTests, RunAllTestsInOrg)"
    required: false
    default: "RunLocalTests"
  tests:
    description: "Space-separated Apex test class names to run -- only used when test-level is RunSpecifiedTests"
    required: false
    default: ""
  check-only:
    description: "Validate only, no changes made (true) or deploy for real (false)"
    required: false
    default: "false"
  wait:
    description: "Minutes to wait for the deploy/validate to finish"
    required: false
    default: "30"

outputs:
  job-id:
    description: "Deploy/validate job id -- feed into sf-quick-deploy to reuse a validated result instead of re-running tests"
    value: ${{ steps.deploy.outputs.job-id }}
  deploy-url:
    description: "Salesforce deploy status page URL, empty if not available"
    value: ${{ steps.deploy.outputs.deploy-url }}
  components-summary:
    description: "Human-readable component deploy summary, e.g. '31 / 31 deployed · 0 errors'"
    value: ${{ steps.deploy.outputs.components-summary }}
  tests-summary:
    description: "Human-readable Apex test summary, e.g. '10 / 10 passed'"
    value: ${{ steps.deploy.outputs.tests-summary }}
  error-message:
    description: "Top-level error / test-failure message, empty on success"
    value: ${{ steps.deploy.outputs.error-message }}
  started-at:
    description: "Deploy start time as reported by Salesforce, e.g. '2026-07-25 22:44:49 UTC'"
    value: ${{ steps.deploy.outputs.started-at }}
  completed-at:
    description: "Deploy completion time as reported by Salesforce, empty if it didn't finish"
    value: ${{ steps.deploy.outputs.completed-at }}

runs:
  using: "composite"
  steps:
    # Everything -- the deploy itself and extracting every output -- has to
    # happen in this ONE step. Composite actions have a real limitation: if
    # an earlier step fails, outputs set by a *later* step (even with
    # `if: always()`) don't propagate to the caller. Only the failing step's
    # own outputs survive. Splitting "run deploy" and "extract summary" into
    # two steps silently dropped every field except job-id on failure.
    - name: Deploy or validate metadata
      id: deploy
      shell: bash
      run: |
        COMMAND="start"
        if [ "${{ inputs.check-only }}" = "true" ]; then
          COMMAND="validate"
        fi

        TESTS_FLAG=""
        if [ -n "${{ inputs.tests }}" ]; then
          TESTS_FLAG="--tests ${{ inputs.tests }}"
        fi

        set +e
        sf project deploy "$COMMAND" \
          --source-dir "${{ inputs.source-dir }}" \
          --target-org "${{ inputs.target-org }}" \
          --test-level "${{ inputs.test-level }}" \
          $TESTS_FLAG \
          --wait "${{ inputs.wait }}" \
          --json > deploy-result.json
        EXIT_CODE=$?
        set -e

        echo "::group::Full deploy result (deploy-result.json)"
        jq . deploy-result.json 2>/dev/null || cat deploy-result.json
        echo "::endgroup::"

        echo "job-id=$(jq -r '.result.id // .data.deployId // empty' deploy-result.json)" >> "$GITHUB_OUTPUT"
        echo "deploy-url=$(jq -r '.result.deployUrl // empty' deploy-result.json)" >> "$GITHUB_OUTPUT"

        DEPLOYED=$(jq -r '.result.numberComponentsDeployed // empty' deploy-result.json)
        TOTAL_COMP=$(jq -r '.result.numberComponentsTotal // empty' deploy-result.json)
        COMP_ERRORS=$(jq -r '.result.numberComponentErrors // empty' deploy-result.json)
        if [ -n "$DEPLOYED" ]; then
          echo "components-summary=$DEPLOYED / $TOTAL_COMP deployed · $COMP_ERRORS errors" >> "$GITHUB_OUTPUT"
        else
          echo "components-summary=" >> "$GITHUB_OUTPUT"
        fi

        COMPLETED=$(jq -r '.result.numberTestsCompleted // empty' deploy-result.json)
        TOTAL_TESTS=$(jq -r '.result.numberTestsTotal // empty' deploy-result.json)
        TEST_ERRORS=$(jq -r '.result.numberTestErrors // 0' deploy-result.json)
        if [ -n "$TOTAL_TESTS" ] && [ "$TOTAL_TESTS" != "0" ]; then
          if [ "$TEST_ERRORS" != "0" ]; then
            echo "tests-summary=$COMPLETED / $TOTAL_TESTS completed · $TEST_ERRORS failed" >> "$GITHUB_OUTPUT"
          elif [ "$COMPLETED" = "$TOTAL_TESTS" ]; then
            echo "tests-summary=$COMPLETED / $TOTAL_TESTS passed" >> "$GITHUB_OUTPUT"
          else
            echo "tests-summary=$COMPLETED / $TOTAL_TESTS completed" >> "$GITHUB_OUTPUT"
          fi
        else
          echo "tests-summary=" >> "$GITHUB_OUTPUT"
        fi

        # .result.errorMessage for a deploy/start failure; top-level .message
        # for a thrown CLI error (e.g. FailedValidationError has no .result).
        ERROR_MSG=$(jq -r '.result.errorMessage // .message // empty' deploy-result.json | tr '\n' ' ')
        echo "error-message=$ERROR_MSG" >> "$GITHUB_OUTPUT"

        echo "started-at=$(jq -r '.result.startDate // empty' deploy-result.json | sed -E 's/T/ /; s/\.[0-9]+Z$/ UTC/')" >> "$GITHUB_OUTPUT"
        echo "completed-at=$(jq -r '.result.completedDate // empty' deploy-result.json | sed -E 's/T/ /; s/\.[0-9]+Z$/ UTC/')" >> "$GITHUB_OUTPUT"

        if [ $EXIT_CODE -ne 0 ]; then
          echo "::error::Deploy/validate failed: ${ERROR_MSG:-Unknown error -- see full result above}"
        fi

        exit $EXIT_CODE
